name: Thesis CSL

on:
  push:
    paths:
      - 'vault/tese/abnt.csl'
      - 'tests/test_abnt_online.py'
      - 'tests/fixtures/abnt-online/**'
      - '.github/workflows/thesis-csl.yml'
  pull_request:
    paths:
      - 'vault/tese/abnt.csl'
      - 'tests/test_abnt_online.py'
      - 'tests/fixtures/abnt-online/**'
      - '.github/workflows/thesis-csl.yml'

permissions:
  contents: read

jobs:
  citeproc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pandoc and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install pytest
      - name: Compile references and check regressions
        run: python -m pytest tests/test_abnt_online.py -q
