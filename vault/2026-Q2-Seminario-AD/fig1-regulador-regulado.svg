<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a365d"/></marker>
    <marker id="arrowL" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#1a365d"/></marker>
  </defs>
  <text x="450" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a365d">Figura 1 — O Estado como Regulador e Regulado</text>
  <rect x="40" y="70" width="300" height="280" rx="12" fill="#f0f7ff" stroke="#1a365d" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d">REGULADOR</text>
  <text x="190" y="125" text-anchor="middle" font-size="12" fill="#4a5568">O Estado edita normas</text>
  <text x="190" y="165" text-anchor="middle" font-size="13" fill="#2d3748">• LGPD (Lei 13.709/2018)</text>
  <text x="190" y="190" text-anchor="middle" font-size="13" fill="#2d3748">• LAI (Lei 12.527/2011)</text>
  <text x="190" y="215" text-anchor="middle" font-size="13" fill="#2d3748">• Lei do Gov. Digital (14.129/2021)</text>
  <text x="190" y="240" text-anchor="middle" font-size="13" fill="#2d3748">• ANPD</text>
  <text x="190" y="275" text-anchor="middle" font-size="12" fill="#718096">Poder-dever de regular</text>
  <text x="190" y="295" text-anchor="middle" font-size="12" fill="#718096">algoritmos no setor público</text>
  <rect x="560" y="70" width="300" height="280" rx="12" fill="#fff5f5" stroke="#9b2c2c" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#9b2c2c">REGULADO</text>
  <text x="710" y="125" text-anchor="middle" font-size="12" fill="#4a5568">O Estado usa algoritmos</text>
  <text x="710" y="165" text-anchor="middle" font-size="13" fill="#2d3748">• INSS (aposentadorias)</text>
  <text x="710" y="190" text-anchor="middle" font-size="13" fill="#2d3748">• Scoring habitacional</text>
  <text x="710" y="215" text-anchor="middle" font-size="13" fill="#2d3748">• Licenças e alvarás</text>
  <text x="710" y="240" text-anchor="middle" font-size="13" fill="#2d3748">• Benefícios assistenciais</text>
  <text x="710" y="275" text-anchor="middle" font-size="12" fill="#718096">Dever-poder exercer</text>
  <text x="710" y="295" text-anchor="middle" font-size="12" fill="#718096">sem os controles que regula</text>
  <line x1="345" y1="180" x2="555" y2="180" stroke="#1a365d" stroke-width="2.5" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <line x1="555" y1="220" x2="345" y2="220" stroke="#1a365d" stroke-width="2.5" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <rect x="370" y="188" width="160" height="24" rx="4" fill="white" stroke="#1a365d" stroke-width="1"/>
  <text x="450" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a365d">SUBAPLICAÇÃO</text>
  <text x="450" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a365d">Fontes do incentivo à subaplicação</text>
  <rect x="60" y="400" width="230" height="60" rx="8" fill="#ebf8ff" stroke="#2c5282" stroke-width="1"/>
  <text x="175" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">1. Eficiência operacional</text>
  <text x="175" y="445" text-anchor="middle" font-size="10" fill="#4a5568">Velocidade &gt; motivação</text>
  <rect x="335" y="400" width="230" height="60" rx="8" fill="#ebf8ff" stroke="#2c5282" stroke-width="1"/>
  <text x="450" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">2. Fornecedores privados</text>
  <text x="450" y="445" text-anchor="middle" font-size="10" fill="#4a5568">Algoritmos opacos para o Estado</text>
  <rect x="610" y="400" width="230" height="60" rx="8" fill="#ebf8ff" stroke="#2c5282" stroke-width="1"/>
  <text x="725" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">3. Ausência de sanções</text>
  <text x="725" y="445" text-anchor="middle" font-size="10" fill="#4a5568">Opacidade algorítmica sem punição</text>
</svg>
